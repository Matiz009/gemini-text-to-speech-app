<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Subtle inner radial glow -->
  <circle cx="256" cy="180" r="180" fill="#ffffff" opacity="0.08" />
  
  <!-- Stylized Speaker & Audio Wave Symbol -->
  <g filter="url(#shadow)" fill="url(#waveGrad)">
    <!-- Speaker Body -->
    <path d="M 170 210 L 220 160 L 220 352 L 170 302 L 130 302 C 120 302 112 294 112 284 L 112 228 C 112 218 120 210 130 210 Z" />
    
    <!-- Sound Waves with dynamic heights -->
    <!-- Wave 1 (small) -->
    <path d="M 264 216 C 278 228 286 242 286 256 C 286 270 278 284 264 296" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
    
    <!-- Wave 2 (medium) -->
    <path d="M 310 186 C 334 206 348 230 348 256 C 348 282 334 306 310 326" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
    
    <!-- Wave 3 (large) -->
    <path d="M 356 156 C 392 186 412 220 412 256 C 412 292 392 326 356 356" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" opacity="0.85" />
    
    <!-- Speech bubble dot accent -->
    <circle cx="166" cy="256" r="10" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
